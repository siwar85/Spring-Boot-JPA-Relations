spring.application.name=autoloc-api

spring.datasource.url=jdbc:mysql://localhost:3306/autoloc_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.hibernate.SQL=DEBUG
logging.level.tn.esprit.autoloc=INFO
server.servlet.context-path=/api
# Swagger UI - liste déroulante des entités (groupes)
springdoc.group-configs[0].group=0 - Toutes les entites
springdoc.group-configs[0].paths-to-match[0]=/**

springdoc.group-configs[1].group=Vehicules
springdoc.group-configs[1].paths-to-match[0]=/vehicules/**

springdoc.group-configs[2].group=Reservations
springdoc.group-configs[2].paths-to-match[0]=/reservations/**

springdoc.group-configs[3].group=Clients
springdoc.group-configs[3].paths-to-match[0]=/clients/**

springdoc.group-configs[4].group=Agences
springdoc.group-configs[4].paths-to-match[0]=/agences/**

springdoc.group-configs[5].group=Contrats
springdoc.group-configs[5].paths-to-match[0]=/contrats/**

springdoc.group-configs[6].group=Employes
springdoc.group-configs[6].paths-to-match[0]=/employes/**

springdoc.group-configs[7].group=Equipements
springdoc.group-configs[7].paths-to-match[0]=/equipements/**

springdoc.group-configs[8].group=Maintenances
springdoc.group-configs[8].paths-to-match[0]=/maintenances/**

springdoc.group-configs[9].group=Paiements
springdoc.group-configs[9].paths-to-match[0]=/paiements/**


# Swagger UI
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.default-models-expand-depth=-1
springdoc.swagger-ui.syntax-highlight.theme=monokai
springdoc.swagger-ui.display-operation-id=true
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.path=/swagger
springdoc.writer-with-order-by-keys=true